{% extends 'base.html' %}

{% block title %}Log In — MaintainX{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card reveal-on-scroll">
    <div class="auth-header">
      <div class="section-label">Authentication</div>
      <h1 class="auth-title editorial-serif">Welcome Back</h1>
      <p class="auth-sub">Enter your credentials to access your maintenance dashboard.</p>
    </div>

    <!-- Login Form -->
    <!-- Form Action: Submits POST request to auth.login Flask route -->
    <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next', '')) }}" id="login-form">
      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          class="form-input" 
          placeholder="name@company.com" 
          value="{{ email or '' }}" 
          required 
          autocomplete="email"
          autofocus
        >
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
          <label for="password" class="form-label" style="margin-bottom: 0;">Password</label>
        </div>
        <input 
          type="password" 
          id="password" 
          name="password" 
          class="form-input" 
          placeholder="••••••••" 
          required 
          autocomplete="current-password"
        >
      </div>

      <div style="margin-top: 1.5rem;">
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="login-submit-btn">
          Log In &rarr;
        </button>
      </div>
    </form>

    <div class="auth-footer">
      Don't have an account yet? 
      <a href="{{ url_for('auth.register') }}" id="link-to-register">Create Account</a>
    </div>
  </div>
</div>
{% endblock %}
