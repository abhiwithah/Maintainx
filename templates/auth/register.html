{% extends 'base.html' %}

{% block title %}Create Account — MaintainX{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card reveal-on-scroll">
    <div class="auth-header">
      <div class="section-label">Get Started</div>
      <h1 class="auth-title editorial-serif">Create an Account</h1>
      <p class="auth-sub">Register to report issues, track repairs, and manage facilities.</p>
    </div>

    <!-- Registration Form -->
    <!-- Form Action: Submits POST request to auth.register Flask route -->
    <form method="POST" action="{{ url_for('auth.register') }}" id="register-form">
      <div class="form-group">
        <label for="name" class="form-label">Full Name</label>
        <input 
          type="text" 
          id="name" 
          name="name" 
          class="form-input" 
          placeholder="Jane Doe" 
          value="{{ name or '' }}" 
          required 
          autocomplete="name"
          autofocus
        >
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Work Email Address</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          class="form-input" 
          placeholder="jane@organization.com" 
          value="{{ email or '' }}" 
          required 
          autocomplete="email"
        >
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          class="form-input" 
          placeholder="At least 6 characters" 
          required 
          minlength="6"
          autocomplete="new-password"
        >
        <div class="form-help">Minimum 6 characters</div>
      </div>

      <div class="form-group">
        <label for="confirm_password" class="form-label">Confirm Password</label>
        <input 
          type="password" 
          id="confirm_password" 
          name="confirm_password" 
          class="form-input" 
          placeholder="Repeat your password" 
          required 
          minlength="6"
          autocomplete="new-password"
        >
      </div>

      <div style="margin-top: 1.5rem;">
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="register-submit-btn">
          Create Account &rarr;
        </button>
      </div>
    </form>

    <div class="auth-footer">
      Already have an account? 
      <a href="{{ url_for('auth.login') }}" id="link-to-login">Log In</a>
    </div>
  </div>
</div>
{% endblock %}
